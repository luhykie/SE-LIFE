{% extends "layout.html" %}
{% block content %}
<div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 animate-fadeIn">
        <div class="bg-white rounded-2xl shadow-2xl p-8">
            <div class="text-center mb-8">
                <div class="bg-gradient-to-r from-green-500 to-emerald-600 text-white rounded-t-2xl -mx-8 -mt-8 p-6 mb-6">
                    <i class="bi bi-person-plus-fill text-5xl mb-3"></i>
                    <h2 class="text-3xl font-bold">Register New Account</h2>
                    <p class="text-green-100 mt-2">Choose the account type to register</p>
                </div>
            </div>

            <div class="space-y-4">
                <a href="{{ url_for('patient_signup') }}" class="block w-full bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 text-white font-semibold py-4 px-6 rounded-lg transition-all transform hover:scale-105 shadow-lg text-center">
                    <i class="bi bi-person-fill text-2xl"></i>
                    <span class="ml-2">Sign Up as Patient</span>
                </a>
            </div>

            <p class="text-center mt-6 text-gray-600">
                Already have an account? 
                <a href="{{ url_for('patient_signin') }}" class="text-green-600 hover:text-green-700 font-semibold">Sign In</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
