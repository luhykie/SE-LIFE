{% extends "layout.html" %}
{% block content %}
<h2 class="fw-bold mb-3">Add Patient</h2>
<form method="post" class="row g-3">
  <div class="col-md-4">
    <label class="form-label">First Name</label>
    <input name="first_name" class="form-control" placeholder="First Name" required>
  </div>
  <div class="col-md-4">
    <label class="form-label">Last Name</label>
    <input name="last_name" class="form-control" placeholder="Last Name" required>
  </div>
  <div class="col-md-4">
    <label class="form-label">Middle Name</label>
    <input name="middle_name" class="form-control" placeholder="Middle Name">
  </div>
  <div class="col-md-2">
    <label class="form-label">Suffix</label>
    <input name="suffix" class="form-control" placeholder="Suffix">
  </div>
  <div class="col-md-3">
    <label class="form-label">Date of Birth</label>
    <input type="date" name="dob" class="form-control" required>
  </div>
  <div class="col-md-3">
    <label class="form-label">Gender</label>
    <select name="sex" class="form-select" required>
      <option value="">Select Gender</option>
      <option value="Male">Male</option>
      <option value="Female">Female</option>
    </select>
  </div>
  <div class="col-md-4">
    <label class="form-label">Contact</label>
    <input type="tel" name="contact" class="form-control" placeholder="Contact" required>
  </div>
  <div class="col-md-6">
    <label class="form-label">Address</label>
    <input type="text" name="address" class="form-control" placeholder="Address">
  </div>
  <div class="col-12">
    <label class="form-label">Notes / Remarks</label>
    <textarea name="notes" class="form-control" rows="3" placeholder="Enter any important notes or remarks..."></textarea>
  </div>
  
  <hr>
  <h4 class="mt-3">Health Record (optional)</h4>
  <div class="col-md-3">
    <label class="form-label">Blood Type</label>
    <select name="blood_type" class="form-select">
      <option value="">-- Select --</option>
      <option value="O+">O+</option>
      <option value="O-">O-</option>
      <option value="A+">A+</option>
      <option value="A-">A-</option>
      <option value="B+">B+</option>
      <option value="B-">B-</option>
      <option value="AB+">AB+</option>
      <option value="AB-">AB-</option>
    </select>
  </div>
  <div class="col-md-3">
    <label class="form-label">Status</label>
    <select name="status" class="form-select">
      <option value="Active" selected>Active</option>
      <option value="Inactive">Inactive</option>
    </select>
  </div>
  <div class="col-12">
    <label class="form-label">Allergies</label>
    <textarea name="allergies" class="form-control" rows="2" placeholder="e.g., Penicillin, Peanuts"></textarea>
  </div>
  <div class="col-12">
    <label class="form-label">Chronic Conditions</label>
    <textarea name="chronic_conditions" class="form-control" rows="2" placeholder="e.g., Diabetes, Hypertension"></textarea>
  </div>
  <div class="col-12 mt-4">
    <button type="submit" class="btn btn-success">Add Patient</button>
    <a href="{{ url_for('patients') }}" class="btn btn-secondary">Cancel</a>
  </div>
</form>
{% endblock %}
