{% extends "layout.html" %}
{% block content %}
<!-- Header -->
<div class="bg-gradient-to-r from-green-500 to-emerald-600 text-white p-8 rounded-lg shadow-lg mb-8 animate-slideDown">
    <h2 class="text-3xl font-bold flex items-center gap-3">
        <i class="bi bi-person-plus-fill"></i>
        Add New Patient
    </h2>
    <p class="text-green-100 mt-2">Register a new patient to the system</p>
</div>

<form method="post" class="bg-white rounded-lg shadow-lg p-8 animate-fadeIn card-hover">
  <h3 class="text-2xl font-bold text-gray-800 mb-4 pb-2 border-b-2 border-green-500">Personal Information</h3>
  <div class="grid md:grid-cols-3 gap-6 mb-6">
    <div>
      <label class="block text-gray-700 font-semibold mb-2">First Name</label>
      <input name="first_name" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent" placeholder="First Name" required>
    </div>
    <div>
      <label class="block text-gray-700 font-semibold mb-2">Last Name</label>
      <input name="last_name" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent" placeholder="Last Name" required>
    </div>
    <div>
      <label class="block text-gray-700 font-semibold mb-2">Middle Name</label>
      <input name="middle_name" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent" placeholder="Middle Name">
    </div>
  </div>
  <div class="grid md:grid-cols-4 gap-6 mb-6">
    <div>
      <label class="block text-gray-700 font-semibold mb-2">Suffix</label>
      <input name="suffix" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent" placeholder="Suffix">
    </div>
    <div>
      <label class="block text-gray-700 font-semibold mb-2">Date of Birth</label>
      <input type="date" name="dob" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent" required>
    </div>
    <div>
      <label class="block text-gray-700 font-semibold mb-2">Gender</label>
      <select name="sex" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent" required>
        <option value="">Select Gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
      </select>
    </div>
    <div>
      <label class="block text-gray-700 font-semibold mb-2">Contact</label>
      <input type="tel" name="contact" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent" placeholder="Contact" required>
    </div>
  </div>
  <div class="mb-6">
    <label class="block text-gray-700 font-semibold mb-2">Address</label>
    <input type="text" name="address" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent" placeholder="Address">
  </div>
  <div class="mb-8">
    <label class="block text-gray-700 font-semibold mb-2">Notes / Remarks</label>
    <textarea name="notes" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent" rows="3" placeholder="Enter any important notes or remarks..."></textarea>
  </div>
  
  <hr class="my-8 border-gray-300">
  <h3 class="text-2xl font-bold text-gray-800 mb-4 pb-2 border-b-2 border-red-500 flex items-center gap-2">
    <i class="bi bi-heart-pulse-fill text-red-500"></i>
    Health Record (optional)
  </h3>
  <div class="grid md:grid-cols-2 gap-6 mb-6">
    <div>
      <label class="block text-gray-700 font-semibold mb-2 flex items-center gap-2">
        <i class="bi bi-droplet-fill text-red-500"></i>
        Blood Type
      </label>
      <select name="blood_type" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent">
        <option value="">-- Select --</option>
        <option value="O+">O+</option>
        <option value="O-">O-</option>
        <option value="A+">A+</option>
        <option value="A-">A-</option>
        <option value="B+">B+</option>
        <option value="B-">B-</option>
        <option value="AB+">AB+</option>
        <option value="AB-">AB-</option>
      </select>
    </div>
    <div>
      <label class="block text-gray-700 font-semibold mb-2 flex items-center gap-2">
        <i class="bi bi-heart-fill text-green-500"></i>
        Status
      </label>
      <select name="status" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent">
        <option value="Active" selected>Active</option>
        <option value="Inactive">Inactive</option>
      </select>
    </div>
  </div>
  <div class="mb-6">
    <label class="block text-gray-700 font-semibold mb-2 flex items-center gap-2">
      <i class="bi bi-exclamation-triangle-fill text-yellow-500"></i>
      Allergies
    </label>
    <textarea name="allergies" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-yellow-500 focus:border-transparent" rows="2" placeholder="e.g., Penicillin, Peanuts"></textarea>
  </div>
  <div class="mb-6">
    <label class="block text-gray-700 font-semibold mb-2 flex items-center gap-2">
      <i class="bi bi-hospital-fill text-red-500"></i>
      Chronic Conditions
    </label>
    <textarea name="chronic_conditions" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent" rows="2" placeholder="e.g., Diabetes, Hypertension"></textarea>
  </div>
  <div class="flex flex-wrap gap-4">
    <button type="submit" class="px-6 py-3 bg-gradient-to-r from-green-500 to-emerald-600 text-white rounded-lg hover:from-green-600 hover:to-emerald-700 transition-all transform hover:scale-105 font-semibold shadow-lg">
      <i class="bi bi-person-plus"></i> Add Patient
    </button>
    <a href="{{ url_for('patients') }}" class="px-6 py-3 bg-gray-600 text-white rounded-lg hover:bg-gray-700 transition-all transform hover:scale-105 font-semibold shadow-lg">
      <i class="bi bi-x-circle"></i> Cancel
    </a>
  </div>
</form>
{% endblock %}
