{% extends "layout.html" %}
{% block content %}
<h2 class="fw-bold mb-3">Edit Patient</h2>
<form method="POST" class="row g-3">
  <div class="col-md-4">
    <label class="form-label">First Name</label>
    <input type="text" name="first_name" class="form-control" value="{{ patient.first_name }}" required>
  </div>
  <div class="col-md-4">
    <label class="form-label">Last Name</label>
    <input type="text" name="last_name" class="form-control" value="{{ patient.last_name }}" required>
  </div>
  <div class="col-md-4">
    <label class="form-label">Middle Name</label>
    <input type="text" name="middle_name" class="form-control" value="{{ patient.middle_name }}">
  </div>
  <div class="col-md-2">
    <label class="form-label">Suffix</label>
    <input type="text" name="suffix" class="form-control" value="{{ patient.suffix }}">
  </div>
  <div class="col-md-3">
    <label class="form-label">Date of Birth</label>
    <input type="date" name="dob" class="form-control" value="{{ patient.dob }}" required>
  </div>
  <div class="col-md-3">
    <label class="form-label">Gender</label>
    <select name="sex" class="form-select" required>
      <option value="Male" {% if patient.sex == "Male" %}selected{% endif %}>Male</option>
      <option value="Female" {% if patient.sex == "Female" %}selected{% endif %}>Female</option>
    </select>
  </div>
  <div class="col-md-4">
    <label class="form-label">Contact</label>
    <input type="text" name="contact" class="form-control" value="{{ patient.contact }}">
  </div>
  <div class="col-md-6">
    <label class="form-label">Address</label>
    <input type="text" name="address" class="form-control" value="{{ patient.address }}">
  </div>
  <div class="col-12">
    <label class="form-label">Notes</label>
    <textarea name="notes" class="form-control">{{ patient.notes }}</textarea>
  </div>
  <div class="col-12 d-flex gap-2">
    <button type="submit" class="btn btn-success">Update</button>
    <a href="{{ url_for('patients') }}" class="btn btn-secondary">Cancel</a>
  </div>
</form>
{% endblock %}
