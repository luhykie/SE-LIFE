{% extends "layout.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card p-4 shadow-sm text-center">
            <h4 class="text-success">Registration Successful</h4>
            <p class="mt-3">Your Patient ID (username) is:</p>
            <h2 class="mb-3">{{ patient_id }}</h2>
            <p class="text-muted">Use this ID and the password you created to sign in as a patient.</p>
            <a href="{{ url_for('patient_signin') }}" class="btn btn-primary mt-3">Go to Patient Sign In</a>
        </div>
    </div>
</div>
{% endblock %}
