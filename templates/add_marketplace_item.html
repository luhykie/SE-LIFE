{% extends "layout.html" %}
{% block content %}
<div class="animate-slideUp">
    <!-- Header -->
    <div class="mb-8">
        <h1 class="text-4xl font-bold text-gray-900 mb-2 flex items-center space-x-3">
            <i class="bi bi-plus-circle text-green-600"></i>
            <span>Add New Marketplace Item</span>
        </h1>
        <p class="text-gray-600">Create a new item for the Barangay Health Marketplace</p>
    </div>

    <div class="bg-white rounded-2xl shadow-lg p-8">
        <form method="POST" class="space-y-6">
            <!-- Item Name -->
            <div>
                <label for="name" class="block text-sm font-semibold text-gray-700 mb-2">
                    <i class="bi bi-tag"></i> Item Name
                </label>
                <input type="text" 
                       id="name" 
                       name="name" 
                       required
                       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all"
                       placeholder="e.g., Paracetamol 500mg">
            </div>

            <!-- Description -->
            <div>
                <label for="description" class="block text-sm font-semibold text-gray-700 mb-2">
                    <i class="bi bi-file-text"></i> Description
                </label>
                <textarea id="description" 
                          name="description" 
                          rows="4"
                          required
                          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all"
                          placeholder="Describe the item..."></textarea>
            </div>

            <!-- Stock and Price Row -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Stock -->
                <div>
                    <label for="stock" class="block text-sm font-semibold text-gray-700 mb-2">
                        <i class="bi bi-box-seam"></i> Stock Quantity
                    </label>
                    <input type="number" 
                           id="stock" 
                           name="stock" 
                           min="0"
                           required
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all"
                           placeholder="e.g., 100">
                </div>

                <!-- Price -->
                <div>
                    <label for="price" class="block text-sm font-semibold text-gray-700 mb-2">
                        <i class="bi bi-currency-peso"></i> Price (₱)
                    </label>
                    <input type="number" 
                           id="price" 
                           name="price" 
                           min="0"
                           step="0.01"
                           required
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all"
                           placeholder="e.g., 5.00">
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex flex-col sm:flex-row gap-4 pt-4">
                <button type="submit" 
                        class="flex-1 bg-green-500 hover:bg-green-600 text-white font-semibold py-3 px-6 rounded-lg transition-all duration-300 transform hover:scale-105 flex items-center justify-center space-x-2">
                    <i class="bi bi-check-circle"></i>
                    <span>Add Item</span>
                </button>
                <a href="{{ url_for('admin_marketplace') }}" 
                   class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-3 px-6 rounded-lg transition-all duration-300 transform hover:scale-105 flex items-center justify-center space-x-2">
                    <i class="bi bi-x-circle"></i>
                    <span>Cancel</span>
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
