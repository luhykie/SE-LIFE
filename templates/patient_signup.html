{% extends "layout.html" %}
{% block content %}
<!-- Header -->
<div class="bg-gradient-to-r from-green-500 to-emerald-600 text-white p-8 rounded-lg shadow-lg mb-8 animate-slideDown">
    <h2 class="text-3xl font-bold flex items-center gap-3 justify-center">
        <i class="bi bi-person-plus-fill"></i>
        Patient Sign Up
    </h2>
    <p class="text-green-100 mt-2 text-center">Create your patient account to access health services</p>
</div>

<!-- Sign Up Form -->
<div class="max-w-4xl mx-auto">
    <div class="bg-white rounded-lg shadow-xl overflow-hidden animate-fadeIn">
        <div class="p-8">
            <form method="POST" action="{{ url_for('patient_signup') }}" class="space-y-6">
                <!-- Name Section -->
                <div class="border-l-4 border-green-500 pl-4 mb-6">
                    <h3 class="text-xl font-bold text-gray-800 flex items-center gap-2">
                        <i class="bi bi-person-badge text-green-600"></i>
                        Personal Information
                    </h3>
                </div>

                <div class="grid md:grid-cols-2 gap-6">
                    <div>
                        <label for="first_name" class="block text-gray-700 font-semibold mb-2">
                            <i class="bi bi-person"></i> First Name <span class="text-red-500">*</span>
                        </label>
                        <input type="text" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all" 
                               id="first_name" name="first_name" required>
                    </div>
                    <div>
                        <label for="last_name" class="block text-gray-700 font-semibold mb-2">
                            <i class="bi bi-person"></i> Last Name <span class="text-red-500">*</span>
                        </label>
                        <input type="text" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all" 
                               id="last_name" name="last_name" required>
                    </div>
                </div>

                <div class="grid md:grid-cols-2 gap-6">
                    <div>
                        <label for="middle_name" class="block text-gray-700 font-semibold mb-2">
                            <i class="bi bi-person"></i> Middle Name
                        </label>
                        <input type="text" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all" 
                               id="middle_name" name="middle_name">
                    </div>
                    <div>
                        <label for="suffix" class="block text-gray-700 font-semibold mb-2">
                            <i class="bi bi-text-left"></i> Suffix
                        </label>
                        <input type="text" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all" 
                               id="suffix" name="suffix" placeholder="Jr., Sr., III, etc.">
                    </div>
                </div>

                <!-- Basic Info Section -->
                <div class="border-l-4 border-blue-500 pl-4 mb-6 mt-8">
                    <h3 class="text-xl font-bold text-gray-800 flex items-center gap-2">
                        <i class="bi bi-info-circle text-blue-600"></i>
                        Basic Information
                    </h3>
                </div>

                <div class="grid md:grid-cols-2 gap-6">
                    <div>
                        <label for="dob" class="block text-gray-700 font-semibold mb-2">
                            <i class="bi bi-calendar-event"></i> Date of Birth <span class="text-red-500">*</span>
                        </label>
                        <input type="date" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all" 
                               id="dob" name="dob" required>
                    </div>
                    <div>
                        <label for="sex" class="block text-gray-700 font-semibold mb-2">
                            <i class="bi bi-gender-ambiguous"></i> Sex <span class="text-red-500">*</span>
                        </label>
                        <select class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all" 
                                id="sex" name="sex" required>
                            <option value="">Select...</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label for="contact" class="block text-gray-700 font-semibold mb-2">
                        <i class="bi bi-telephone"></i> Contact Number <span class="text-red-500">*</span>
                    </label>
                    <input type="tel" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all" 
                           id="contact" name="contact" placeholder="09171234567" required>
                </div>

                <div>
                    <label for="address" class="block text-gray-700 font-semibold mb-2">
                        <i class="bi bi-geo-alt"></i> Address
                    </label>
                    <textarea class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all" 
                              id="address" name="address" rows="2"></textarea>
                </div>

                <!-- Account Security Section -->
                <div class="border-l-4 border-purple-500 pl-4 mb-6 mt-8">
                    <h3 class="text-xl font-bold text-gray-800 flex items-center gap-2">
                        <i class="bi bi-shield-lock text-purple-600"></i>
                        Account Security
                    </h3>
                </div>

                <div class="grid md:grid-cols-2 gap-6">
                    <div>
                        <label for="password" class="block text-gray-700 font-semibold mb-2">
                            <i class="bi bi-key"></i> Password <span class="text-red-500">*</span>
                        </label>
                        <input type="password" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all" 
                               id="password" name="password" required minlength="6">
                        <small class="text-gray-500 text-sm mt-1 block">Minimum 6 characters</small>
                    </div>
                    <div>
                        <label for="confirm_password" class="block text-gray-700 font-semibold mb-2">
                            <i class="bi bi-key-fill"></i> Confirm Password <span class="text-red-500">*</span>
                        </label>
                        <input type="password" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all" 
                               id="confirm_password" name="confirm_password" required minlength="6">
                    </div>
                </div>

                <div>
                    <label for="notes" class="block text-gray-700 font-semibold mb-2">
                        <i class="bi bi-chat-left-text"></i> Additional Notes
                    </label>
                    <textarea class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all" 
                              id="notes" name="notes" rows="3" placeholder="Any medical conditions, allergies, or important information..."></textarea>
                </div>

                <div class="pt-4">
                    <button type="submit" class="w-full bg-gradient-to-r from-green-500 to-emerald-600 text-white px-8 py-4 rounded-lg hover:from-green-600 hover:to-emerald-700 transition-all transform hover:scale-105 font-bold text-lg shadow-lg">
                        <i class="bi bi-check-circle"></i> Create Account
                    </button>
                </div>
            </form>
        </div>

        <div class="bg-gray-50 px-8 py-4 border-t border-gray-200">
            <p class="text-center text-gray-600">
                Already have an account? 
                <a href="{{ url_for('patient_signin') }}" class="text-green-600 hover:text-green-700 font-semibold hover:underline">
                    Sign In Here
                </a>
            </p>
        </div>
    </div>
</div>

<script>
    // Password confirmation validation
    document.querySelector('form').addEventListener('submit', function(e) {
        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirm_password').value;
        
        if (password !== confirm) {
            e.preventDefault();
            alert('Passwords do not match!');
        }
    });
</script>
{% endblock %}
