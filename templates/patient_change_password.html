{% extends "layout.html" %}
{% block content %}
<!-- Header -->
<div class="bg-gradient-to-r from-blue-500 to-indigo-600 text-white p-8 rounded-lg shadow-lg mb-8 animate-slideDown">
    <h2 class="text-3xl font-bold flex items-center gap-3">
        <i class="bi bi-shield-lock-fill"></i>
        Change Password
    </h2>
    <p class="text-blue-100 mt-2">Update your account password</p>
</div>

{% if error %}
<div class="bg-red-50 border-2 border-red-200 rounded-lg p-4 mb-6 animate-fadeIn">
    <p class="text-red-800 flex items-center gap-2">
        <i class="bi bi-exclamation-triangle-fill text-red-600"></i>
        {{ error }}
    </p>
</div>
{% endif %}

{% if success %}
<div class="bg-green-50 border-2 border-green-200 rounded-lg p-4 mb-6 animate-fadeIn">
    <p class="text-green-800 flex items-center gap-2">
        <i class="bi bi-check-circle-fill text-green-600"></i>
        {{ success }}
    </p>
</div>
{% endif %}

<form method="POST" class="bg-white rounded-lg shadow-lg p-8 animate-fadeIn card-hover max-w-2xl mx-auto">
    <div class="mb-6">
        <label class="block text-gray-700 font-semibold mb-2 flex items-center gap-2">
            <i class="bi bi-lock-fill text-gray-600"></i>
            Current Password <span class="text-red-500">*</span>
        </label>
        <input type="password" name="current_password" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="Enter current password" required>
    </div>

    <div class="mb-6">
        <label class="block text-gray-700 font-semibold mb-2 flex items-center gap-2">
            <i class="bi bi-key-fill text-blue-500"></i>
            New Password <span class="text-red-500">*</span>
        </label>
        <input type="password" name="new_password" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="Enter new password" required>
    </div>

    <div class="mb-6">
        <label class="block text-gray-700 font-semibold mb-2 flex items-center gap-2">
            <i class="bi bi-key-fill text-blue-500"></i>
            Confirm New Password <span class="text-red-500">*</span>
        </label>
        <input type="password" name="confirm_password" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="Re-enter new password" required>
    </div>

    <div class="flex flex-wrap gap-4">
        <button type="submit" class="px-6 py-3 bg-gradient-to-r from-blue-500 to-indigo-600 text-white rounded-lg hover:from-blue-600 hover:to-indigo-700 transition-all transform hover:scale-105 font-semibold shadow-lg">
            <i class="bi bi-shield-check"></i> Change Password
        </button>
        <a href="{{ url_for('patient_profile') }}" class="px-6 py-3 bg-gray-600 text-white rounded-lg hover:bg-gray-700 transition-all transform hover:scale-105 font-semibold shadow-lg">
            <i class="bi bi-x-circle"></i> Cancel
        </a>
    </div>
</form>
{% endblock %}
