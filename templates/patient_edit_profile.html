{% extends "layout.html" %}
{% block content %}
<h2 class="fw-bold mb-3 text-warning">Edit My Profile</h2>
<p class="text-muted">You can only update contact information and address details. Other fields are managed by clinic staff.</p>

<form method="POST" action="{{ url_for('patient_edit_profile') }}" class="row g-3">
  <div class="col-md-4">
    <label class="form-label">First Name</label>
    <input type="text" name="first_name" class="form-control" value="{{ patient.first_name }}" required>
  </div>
  <div class="col-md-4">
    <label class="form-label">Last Name</label>
    <input type="text" name="last_name" class="form-control" value="{{ patient.last_name }}" required>
  </div>
  <div class="col-md-4">
    <label class="form-label">Middle Name</label>
    <input type="text" name="middle_name" class="form-control" value="{{ patient.middle_name or '' }}">
  </div>
  <div class="col-md-2">
    <label class="form-label">Suffix</label>
    <input type="text" name="suffix" class="form-control" value="{{ patient.suffix or '' }}">
  </div>
  <div class="col-md-3">
    <label class="form-label">Date of Birth</label>
    <input type="date" name="dob" class="form-control" value="{{ patient.dob }}" required>
  </div>
  <div class="col-md-3">
    <label class="form-label">Gender</label>
    <select name="sex" class="form-select" disabled>
      <option value="Male" {% if patient.sex == "Male" %}selected{% endif %}>Male</option>
      <option value="Female" {% if patient.sex == "Female" %}selected{% endif %}>Female</option>
    </select>
    <small class="text-muted">Non-editable field.</small>
  </div>
  <div class="col-md-4">
    <label class="form-label">Contact</label>
    <input type="text" name="contact" class="form-control" value="{{ patient.contact }}">
  </div>
  <div class="col-md-6">
    <label class="form-label">Address</label>
    <input type="text" name="address" class="form-control" value="{{ patient.address or '' }}">
  </div>
  <div class="col-12">
    <label class="form-label">Notes / Remarks (Clinic Only)</label>
    <textarea name="notes" class="form-control" rows="3" readonly>{{ patient.notes or 'No current remarks by clinic staff.' }}</textarea>
    <small class="text-muted">Clinic notes are read-only.</small>
  </div>
  <div class="col-12 mt-4">
    <button type="submit" class="btn btn-warning">Save My Changes</button>
    <a href="{{ url_for('patient_profile') }}" class="btn btn-secondary">Cancel</a>
  </div>
</form>
{% endblock %}
