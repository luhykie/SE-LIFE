{% extends "layout.html" %}
{% block content %}
<div class="min-h-[calc(100vh-20rem)] flex items-center justify-center">
    <div class="w-full max-w-md animate-slideUp">
        <!-- Card -->
        <div class="bg-white rounded-2xl shadow-2xl overflow-hidden">
            <!-- Header -->
            <div class="bg-gradient-to-r from-amber-500 to-orange-600 p-8 text-center">
                <i class="bi bi-shield-fill-check text-white text-6xl mb-4 inline-block animate-pulse"></i>
                <h2 class="text-3xl font-bold text-white mb-2">Worker / Admin Sign In</h2>
                <p class="text-amber-100">Access the management portal</p>
            </div>

            <!-- Body -->
            <div class="p-8">
                {% if error %}
                <div class="bg-red-50 border-l-4 border-red-500 text-red-700 p-4 mb-6 rounded animate-slideDown">
                    <div class="flex items-center space-x-2">
                        <i class="bi bi-exclamation-triangle-fill"></i>
                        <span>{{ error }}</span>
                    </div>
                </div>
                {% endif %}

                <form method="POST" action="{{ url_for('worker_signin') }}" class="space-y-6">
                    <!-- Barangay ID -->
                    <div>
                        <label class="block text-gray-700 font-semibold mb-2">
                            <i class="bi bi-person-badge"></i> Barangay ID
                        </label>
                        <input type="text" name="barangay_id" 
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-transparent transition-all duration-300" 
                               placeholder="Enter your Barangay ID" required>
                    </div>

                    <!-- Password -->
                    <div>
                        <label class="block text-gray-700 font-semibold mb-2">
                            <i class="bi bi-lock-fill"></i> Password
                        </label>
                        <input type="password" name="password" 
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-transparent transition-all duration-300" 
                               placeholder="Enter your password" required>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" 
                            class="w-full bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-600 hover:to-orange-700 text-white font-bold py-4 rounded-lg transition-all duration-300 transform hover:scale-105 hover:shadow-xl flex items-center justify-center space-x-2">
                        <i class="bi bi-box-arrow-in-right text-xl"></i>
                        <span>Sign In</span>
                    </button>
                </form>

                <!-- Footer Links -->
                <div class="mt-6 text-center space-y-3">
                    <p class="text-gray-600">
                        Not a Worker/Admin? 
                        <a href="{{ url_for('patient_signin') }}" class="text-green-600 hover:text-green-700 font-semibold transition-colors">
                            Patient Sign In
                        </a>
                    </p>
                    <div class="bg-amber-50 border border-amber-200 rounded-lg p-3">
                        <p class="text-amber-800 text-sm">
                            <i class="bi bi-info-circle"></i>
                            <strong>Demo:</strong> ID: ADMIN123, Password: password
                        </p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Back to Home -->
        <div class="text-center mt-6">
            <a href="{{ url_for('home') }}" class="text-gray-600 hover:text-gray-900 transition-colors flex items-center justify-center space-x-2">
                <i class="bi bi-arrow-left"></i>
                <span>Back to Home</span>
            </a>
        </div>
    </div>
</div>
{% endblock %}
