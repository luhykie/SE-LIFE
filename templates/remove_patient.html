{% extends "layout.html" %}
{% block content %}
<h2 class="mb-3 text-danger">Remove Multiple Patients</h2>

<form id="removeForm" method="POST">
  <div class="mb-3">
    <p>Select patients you want to remove:</p>
    <div class="list-group" style="max-height: 400px; overflow-y: auto;">
      {% for patient in patients %}
      <label class="list-group-item">
        <input type="checkbox" name="ids" value="{{ patient.id }}" class="form-check-input me-2 patient-checkbox">
        <strong class="me-2">#{{ patient.id }}</strong> {{ patient.first_name }} {{ patient.last_name }}
      </label>
      {% endfor %}
    </div>
  </div>

  <button type="submit" class="btn btn-danger">Remove Selected</button>
  <a href="{{ url_for('patients') }}" class="btn btn-secondary">Cancel</a>
</form>

<script>
const form = document.getElementById('removeForm');

form.addEventListener('submit', function(e) {
    const checkedBoxes = document.querySelectorAll('.patient-checkbox:checked');
    if (checkedBoxes.length === 0) {
        alert('Please select at least one patient to remove.');
        e.preventDefault();
        return;
    }

    let names = [];
    checkedBoxes.forEach(cb => {
        const label = cb.parentElement.textContent.trim().replace(/^\s*#\d+\s*/, '');
        names.push(label);
    });

    const confirmation = `Are you sure you want to permanently delete the following ${checkedBoxes.length} patient(s)?\n\n- ${names.join('\n- ')}\n\nThis action cannot be undone.`;

    if (!confirm(confirmation)) {
        e.preventDefault();
    }
});
</script>
{% endblock %}
